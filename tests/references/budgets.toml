[digamma.float64]
default = 4

# Reflection + cot(pi x) conditioning near negative poles. Poles are
# unit-spaced on the entire negative axis, so every grid point is within 0.5
# of a pole; the reference table extends to ~-9999, and the same conditioning
# applies throughout.
[[digamma.float64.regions]]
lo = -10000.0
hi = -0.009
ulp = 16

# psi has exactly one zero strictly between each pair of consecutive negative
# poles (trigamma > 0 off the poles, so psi is monotonic on each interval):
# x ~ -0.504083, -1.573498, -2.610721, -3.635293, ... out to the edge of the
# table. The reflection formula subtracts an O(1) cot term from psi(1-x) to
# reach a near-zero result there, so relative error is ill-conditioned in
# narrow windows around each crossing while absolute error stays at rounding
