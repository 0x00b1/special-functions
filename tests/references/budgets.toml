# The accuracy contract. Default: <=4 ULP vs correctly-rounded mpmath truth.
# Regions may override with a larger ULP budget or an absolute tolerance,
# only where the spec allows (pole neighborhoods, psi zeros). Identical for
# every backend.

[log_gamma.float64]
default = 4

# Reflection + log|sin(pi x)| conditioning near negative poles.
[[log_gamma.float64.regions]]
lo = -30.0
hi = -0.009
ulp = 16

# log|Gamma| has interior zeros on the negative axis where |Gamma(x)|
# crosses 1: x ~ -2.457025, -2.747683, -3.143581, -3.955294, -4.039.
# The reflection formula subtracts O(1) terms down to a near-zero result
# there, so relative error is ill-conditioned in narrow windows around each
# crossing while absolute error stays at rounding level. Windows are atol-
# governed, ~+-0.05 wide; everything between them (including the pole
# neighborhoods at -3/-4 and plain points like x=-3.5) stays under the
# ulp=16 region above (measured max outside the windows: 13 ULP). The
# -3.955294 crossing needs no window: measured max 4 ULP on its grid points.

# Crossing at x ~ -4.039. Measured worst: 5.42e-16 abs (39 ULP) at
# x=-4.0370141784820675.
[[log_gamma.float64.regions]]
lo = -4.09
hi = -4.01
atol = 6.0e-16

# Crossing at x ~ -3.143581. Measured worst: 6.04e-16 abs (87 ULP) at
# x=-3.150915419823541.
[[log_gamma.float64.regions]]
lo = -3.2
hi = -3.09
atol = 7.0e-16

# Crossing at x ~ -2.747683. Measured worst: 2.60e-16 abs (599 ULP) at
# x=-2.7493163039227886.
[[log_gamma.float64.regions]]
lo = -2.8
hi = -2.7
atol = 3.0e-16

# Crossing at x ~ -2.457025. Measured worst: 1.94e-16 abs (263 ULP at
# x=-2.454853574004301).
[[log_gamma.float64.regions]]
lo = -2.51
hi = -2.41
atol = 2.5e-16

# Pole at x=-12 coincides with the Stirling/recurrence switch at 1-x=13
# (SF_LOG_GAMMA_FLOAT64_STIRLING_THRESHOLD); reflection amplifies the
# branch-boundary residual right at the pole. Measured worst: 38 ULP
# (4.22e-15 abs) at x=-11.999999999.
[[log_gamma.float64.regions]]
lo = -12.001
hi = -11.999
ulp = 40

# log_gamma's exact zero at x=1: the (x-1) factor drives the result to 0
# while intermediate terms (interval fit, log(x) in the recurrence) stay
# O(1), so fixed absolute rounding dominates near the zero. Measured worst:
# 4.86e-17 abs at x=0.9440550688360451.
[[log_gamma.float64.regions]]
lo = 0.9
hi = 1.0
atol = 1.0e-16

[log_gamma.float32]
default = 4

[[log_gamma.float32.regions]]
lo = -30.0
hi = -0.009
ulp = 16

# Same per-crossing interior-zero windows as float64 (see above); measured
# max outside the windows is 11 ULP, under the ulp=16 region. The -3.955294
# crossing again needs no window (measured max 4 ULP).

# Crossing at x ~ -4.039. Measured worst: 3.28e-7 abs at x=-4.0620265.
[[log_gamma.float32.regions]]
lo = -4.09
hi = -4.01
atol = 3.5e-7

# Crossing at x ~ -3.143581. Measured worst: 2.39e-7 abs (64 ULP) at
# x=-3.1509154.
[[log_gamma.float32.regions]]
lo = -3.2
hi = -3.09
atol = 2.5e-7

# Crossing at x ~ -2.747683. Measured worst: 1.57e-7 abs at x=-2.7924314
# (66 ULP at x=-2.7493162).
[[log_gamma.float32.regions]]
lo = -2.8
hi = -2.7
atol = 2.0e-7

# Crossing at x ~ -2.457025. Measured worst: 1.51e-7 abs at x=-2.4429557
# (256 ULP at x=-2.4548535).
[[log_gamma.float32.regions]]
lo = -2.51
hi = -2.41
atol = 2.0e-7

# Same x=1 zero conditioning as float64. Measured worst: 2.61e-8 abs
# at x=0.948921.
[[log_gamma.float32.regions]]
lo = 0.9
hi = 1.0
atol = 5.0e-8

[digamma.float64]
default = 4

# Relative error is ill-conditioned at psi's positive zero (~1.46163).
[[digamma.float64.regions]]
lo = 1.35
hi = 1.6
atol = 1.0e-15

[[digamma.float64.regions]]
lo = -30.0
hi = -0.009
ulp = 16

[digamma.float32]
default = 4

[[digamma.float32.regions]]
lo = 1.35
hi = 1.6
atol = 6.0e-7

[[digamma.float32.regions]]
lo = -30.0
hi = -0.009
ulp = 16
